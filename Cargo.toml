[package]
name = "ap2-verifier-core"
version = "0.1.0-dev"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Scoped AP2 verification core; experimental, unpublished"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
base64 = "=0.22.1"
p256 = { version = "=0.13.2", features = ["ecdsa", "pem"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"

[profile.release]
panic = "unwind"
overflow-checks = true
